app:
  port: ${APP_PORT:8080}
  logging: debug
  api-key: ${APP_API_KEY:default-secret-key}
  consul:
    host: consul-service
    port: 8500
  n8n:
    webhook-url: ${APP_N8N_WEBHOOK_URL:https://n8n.hub.um.edu.ar}

server:
  port: ${app.port}

spring:
  application:
    name: tesoreria-umhub-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 200000
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        tags: tesoreria,umhub
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:tesoreria-umhub-group}

logging:
  level:
    tesoreria.umhub: ${app.logging}
    web: ${app.logging}
    org:
      springframework:
        web: ${app.logging}
        cloud: ${app.logging}
        security: ${app.logging}
    feign: ${app.logging}
    feign.hystrix: ${app.logging}
